include ':app'

// NewPipe Extractor is vendored into this repository (./NewPipeExtractor) instead of being pulled
// from JitPack: JitPack stopped serving the published artifacts of
// com.github.ShareASmile.NewPipeExtractor (404), which made the build unresolvable.
includeBuild('NewPipeExtractor') {
    dependencySubstitution {
        substitute module('com.github.ShareASmile.NewPipeExtractor:NewPipeExtractor') with project(':extractor')
    }
}
